# Runs the package on every runtime identifier it ships, before it is published.
#
# The CD proves the package builds. This proves it works: each leg installs the .nupkg a CD run
# produced, calls into the native library through it, drives a tileset to its root tile from a
# host written in C#, and fails the job if any of that does not happen.
#
# win-arm64 is cross-compiled in CesiumC, on an x64 Windows runner, so its library is executed
# nowhere else. This is the only thing that runs it.
#
# browser-wasm needs its own job rather than a row in the matrix, because nothing about it
# resembles the others: the archive is linked into the application when it publishes instead of
# being loaded out of runtimes/ at run time, so what makes it work is the package's
# buildTransitive targets file and the name the archive is packed under. WasmSmokeTest existed
# for weeks before this and no workflow ran it, which is how the same two mistakes went unnoticed
# in Evergine.Bindings.JoltPhysics until somebody opened the published .nupkg by hand.
#
# android-arm64 is the one leg that asserts rather than runs. No runner can execute an APK
# without an emulator, and standing one up per release was decided against, so instead the APK is
# opened and lib/arm64-v8a/libCesiumNativeC.so has to be inside it. That is a real check and not
# a consolation prize: it is exactly the mistake Evergine.Bindings.JoltPhysics shipped for months,
# a native library present in the package and absent from where the platform looks for it.
#
# iossimulator-arm64 asserts too, and against the link rather than the package layout. There the
# archive is linked into the executable, so what can go wrong is that the targets file never put
# it on the link line, or that the DllImport name did not become "__Internal". Both leave a green
# build behind, which is why the leg opens the binary and looks for the symbol.
#
# Intel macOS used to be the sixth. It was dropped on 2026-08-08 for the reason this file exists
# to prevent: three attempts across two days never got a macos-13 runner, so it was the one
# identifier shipping without anything having ever executed it.
name: Package smoke test

on:
  # Called by the CD, where it stands between packing and publishing, and dispatchable by hand
  # against any past run's artifact.
  workflow_call:
    inputs:
      cd-run-id:
        description: >-
          The CD run whose nuget-packages artifact to test. Leave empty when calling from the
          run that produced it, which is the normal case.
        required: false
        type: string
        default: ''
      rids:
        description: >-
          Comma-separated desktop runtime identifiers to run. Empty means all five. The wasm leg
          is a separate job and always runs.
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      cd-run-id:
        description: >-
          The CD run whose nuget-packages artifact to test, e.g. 31220702712. Take it from a run
          started with skip-assets-publishing, so nothing has been published yet.
        required: true
        type: string
      rids:
        description: >-
          Comma-separated desktop runtime identifiers to run, e.g. win-arm64. Leave empty for all
          five. Retrying one identifier should not drag the four that already passed along with
          it. This does not reach the wasm leg, which is a separate job and always runs.
        required: false
        type: string

jobs:
  # The matrix is built here rather than filtered in the job below, because an `if` on a matrix
  # job does not stop it queueing for a runner -- it would sit waiting for the very machine that
  # is scarce, and then skip.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          WANTED: ${{ inputs.rids }}
        run: |
          set -euo pipefail

          # Plain shell rather than jq, so the whole thing can be run on a developer machine
          # before it is pushed. win-arm64 is cross-compiled in CesiumC, so this workflow is the
          # only place its binary ever executes.
          ORDER="win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64"
          runner_for() {
            case "$1" in
              win-x64)     echo windows-latest ;;
              win-arm64)   echo windows-11-arm ;;
              linux-x64)   echo ubuntu-latest ;;
              linux-arm64) echo ubuntu-24.04-arm ;;
              osx-arm64)   echo macos-14 ;;
              *)           echo "" ;;
            esac
          }

          selected="${WANTED:-}"
          if [ -z "$selected" ]; then
            selected="$ORDER"
          else
            selected=$(echo "$selected" | tr ',' ' ')
          fi

          entries=""
          for rid in $selected; do
            os=$(runner_for "$rid")
            if [ -z "$os" ]; then
              echo "::error::'$rid' is not a runtime identifier this workflow knows"
              for known in $ORDER; do echo "  known: $known"; done
              exit 1
            fi
            entries="${entries}{\"rid\":\"$rid\",\"os\":\"$os\"},"
            echo "  $rid on $os"
          done

          echo "matrix=[${entries%,}]" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The artifact the CD produced rather than one packed here, so the thing under test is
      # what would be published, byte for byte.
      #
      # Two ways in, because the artifact lives in a different place depending on who is asking.
      # Called from the CD it belongs to this same run, and download-artifact finds it with no
      # id at all. Dispatched by hand it belongs to a run that finished days ago, which only
      # `gh run download` can reach.
      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: DesktopSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p DesktopSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY" \
            -n nuget-packages -D DesktopSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la DesktopSmokeTest/local-packages/

          pkg=$(ls DesktopSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on ${{ matrix.rid }}"

      - name: Run the package on ${{ matrix.rid }}
        shell: bash
        working-directory: DesktopSmokeTest
        run: |
          set -euo pipefail
          dotnet run -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"

  # Its own job rather than a row in the matrix above, because almost nothing is shared: there is
  # no runtime identifier to select, the wasm workload has to be installed, publishing is not
  # optional, and the thing that runs the result is node rather than the host.
  #
  # The fetch and the version parse are repeated from the desktop job instead of being hoisted
  # into `prepare`. Hoisting would mean prepare downloading the artifact too, which trades a dozen
  # duplicated lines for a coupling between a job that decides a matrix and the artifact under
  # test. The duplication is the cheaper of the two.
  wasm:
    name: browser-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Not present on the runner by default, and without it WasmBuildNative has no Emscripten to
      # link with.
      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: WasmSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p WasmSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY" \
            -n nuget-packages -D WasmSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la WasmSmokeTest/local-packages/

          pkg=$(ls WasmSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on browser-wasm"

      # Publish then node, not `dotnet run`: there is no host that runs a browser-wasm application,
      # and the link that this whole leg exists to check only happens on publish.
      - name: Run the package on browser-wasm
        shell: bash
        working-directory: WasmSmokeTest
        run: |
          set -euo pipefail
          dotnet publish -c Release -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"
          node bin/Release/net10.0/browser-wasm/AppBundle/main.mjs

  # Builds an APK against the package and then opens it. `dotnet build` succeeding proves the
  # managed side compiled and says nothing about whether the native library travelled with it,
  # which is the only question this leg exists to answer.
  android:
    name: android-arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install the android workload
        run: dotnet workload install android

      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: AndroidSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p AndroidSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY"             -n nuget-packages -D AndroidSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la AndroidSmokeTest/local-packages/

          pkg=$(ls AndroidSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on android-arm64"

      - name: Build an APK against the package
        shell: bash
        working-directory: AndroidSmokeTest
        run: |
          set -euo pipefail
          dotnet build -c Release -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"

      # The assertion. A package can carry runtimes/android-arm64/native and still lose it on the
      # way into the APK, and the build would be green either way.
      - name: Check the native library is inside the APK
        shell: bash
        working-directory: AndroidSmokeTest
        run: |
          set -euo pipefail
          apk=$(find bin -name '*-Signed.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::no APK was produced"; exit 1; }

          echo "APK: $apk"
          python3 - "$apk" <<'CHECK'
          import sys, zipfile, os

          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          wanted = "lib/arm64-v8a/libCesiumNativeC.so"

          libs = sorted(n for n in z.namelist() if n.startswith("lib/"))
          print("  APK is %.1f MB and carries %d native libraries" % (os.path.getsize(apk) / 1e6, len(libs)))

          if wanted not in libs:
              print("::error::%s is not in the APK. The package carried it and the build dropped it." % wanted)
              for n in libs:
                  print("    has: %s" % n)
              sys.exit(1)

          size = z.getinfo(wanted).file_size
          print("  ok    %s (%.1f MB uncompressed)" % (wanted, size / 1e6))

          # A library that is present and empty would satisfy the check above and nothing else.
          if size < 1_000_000:
              print("::error::only %d bytes; that is not cesium-native." % size)
              sys.exit(1)

          # Every ABI here is one the package had to supply. Anything beyond arm64-v8a means the
          # project asked for a runtime identifier CesiumC does not build.
          abis = {n.split("/")[1] for n in libs}
          if abis != {"arm64-v8a"}:
              print("::error::unexpected ABIs in the APK: %s" % ", ".join(sorted(abis)))
              sys.exit(1)

          print("PASS")
          CHECK

  # The only thing in this repository that can say whether the package works on iOS.
  #
  # Nothing is loaded there: Apple only allows dynamic libraries that ship inside the app bundle
  # as frameworks, so CesiumC builds a static archive and the package's targets file links it into
  # the executable. Two things have to hold, and neither is visible on any other leg: the targets
  # file has to put the archive on the link line, and Native.Dll has to have compiled to
  # "__Internal", because once linked only that name reaches the symbols. Get either wrong and
  # every build still succeeds; the failure arrives at the first P/Invoke in somebody's app.
  #
  # A build is the assertion. The linker resolving the P/Invokes against the archive is the
  # property under test and it is checked at link time, so this is a result rather than a
  # consolation prize.
  #
  # The simulator rather than the device, and it is a real limitation stated rather than hidden:
  # a device build needs a signing identity and a provisioning profile that a runner does not
  # have. Both identifiers link the same archive through the same targets file, so what this
  # says about ios-arm64 is indirect.
  ios:
    name: iossimulator-arm64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install the ios workload
        run: dotnet workload install ios

      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: iOSSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p iOSSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY" \
            -n nuget-packages -D iOSSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la iOSSmokeTest/local-packages/

          pkg=$(ls iOSSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on iossimulator-arm64"

      - name: Link an iOS application against the package
        shell: bash
        working-directory: iOSSmokeTest
        run: |
          set -euo pipefail
          dotnet build -c Release -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"

      # Said out loud, because a build that quietly linked nothing would look identical from the
      # outside. The archive is 61 MB and an application that took it cannot come out small.
      - name: Check the archive actually reached the executable
        shell: bash
        working-directory: iOSSmokeTest
        run: |
          set -euo pipefail
          app=$(find bin -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::no .app bundle was produced"; exit 1; }

          exe="$app/$(basename "$app" .app)"
          [ -f "$exe" ] || { echo "::error::no executable at $exe"; ls -la "$app"; exit 1; }

          size=$(stat -f%z "$exe")
          echo "  executable: $((size / 1000000)) MB"

          # cesium-native merged in is tens of megabytes. An executable that linked none of it
          # comes out at a couple, which is the difference this catches.
          if [ "$size" -lt 10000000 ]; then
            echo "::error::only $((size / 1000000)) MB; the archive was not linked in"
            exit 1
          fi

          # And the symbols themselves, which is what would be missing if Native.Dll had compiled
          # to "CesiumNativeC" rather than "__Internal".
          if ! nm -U "$exe" 2>/dev/null | grep -q "cesium_async_system_create"; then
            echo "::error::cesium_async_system_create is not defined in the executable"
            exit 1
          fi
          echo "  ok    cesium_async_system_create is defined in the executable"
          echo "PASS"

# Runs the package on every runtime identifier it ships, before it is published.
#
# The CD proves the package builds. This proves it works: each leg installs the .nupkg a CD run
# produced, calls into the native library through it, drives a tileset to its root tile from a
# host written in C#, and fails the job if any of that does not happen.
#
# Two of the six are cross-compiled in CesiumC -- win-arm64 is built on an x64 Windows runner
# and osx-x64 on an arm64 mac -- so their libraries have never been executed anywhere. This is
# the first thing that runs them.
name: Package smoke test

on:
  # Called by the CD, where it stands between packing and publishing, and dispatchable by hand
  # against any past run's artifact.
  workflow_call:
    inputs:
      cd-run-id:
        description: >-
          The CD run whose nuget-packages artifact to test. Leave empty when calling from the
          run that produced it, which is the normal case.
        required: false
        type: string
        default: ''
      rids:
        description: 'Comma-separated runtime identifiers to run. Empty means all six.'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      cd-run-id:
        description: >-
          The CD run whose nuget-packages artifact to test, e.g. 31220702712. Take it from a run
          started with skip-assets-publishing, so nothing has been published yet.
        required: true
        type: string
      rids:
        description: >-
          Comma-separated runtime identifiers to run, e.g. osx-x64. Leave empty for all six.
          Retrying one identifier should not drag the five that already passed along with it,
          and osx-x64 needs retrying because macos-13 is the last Intel runner in the catalogue
          and is hard to get.
        required: false
        type: string

jobs:
  # The matrix is built here rather than filtered in the job below, because an `if` on a matrix
  # job does not stop it queueing for a runner -- it would sit waiting for the very machine that
  # is scarce, and then skip.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          WANTED: ${{ inputs.rids }}
        run: |
          set -euo pipefail

          # Plain shell rather than jq, so the whole thing can be run on a developer machine
          # before it is pushed. Where each identifier is exercised is a fact worth stating
          # once: win-arm64 and osx-x64 are cross-compiled in CesiumC, so this workflow is the
          # only place their binaries ever execute.
          # osx-x64 is deliberately absent from the default set, and that is a decision rather
          # than an oversight. It needs macos-13, the last Intel runner in the catalogue and one
          # on its way out: three attempts on two different days never got a machine, twice
          # waiting half an hour. Since the CD gates publishing on `needs: smoke`, and `needs`
          # waits for every leg of the matrix, leaving it in would make every publish wait on the
          # scarcest runner GitHub has. A gate that never opens does not protect anything.
          #
          # It is still reachable by dispatching this workflow with `rids: osx-x64`, and the
          # README records that it is the one identifier nothing has ever executed -- CesiumC
          # cross-compiles it on an arm64 mac, so not even the C++ tests touch it.
          DEFAULT="win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64"
          ORDER="$DEFAULT osx-x64"
          runner_for() {
            case "$1" in
              win-x64)     echo windows-latest ;;
              win-arm64)   echo windows-11-arm ;;
              linux-x64)   echo ubuntu-latest ;;
              linux-arm64) echo ubuntu-24.04-arm ;;
              osx-arm64)   echo macos-14 ;;
              osx-x64)     echo macos-13 ;;
              *)           echo "" ;;
            esac
          }

          selected="${WANTED:-}"
          if [ -z "$selected" ]; then
            selected="$DEFAULT"
          else
            selected=$(echo "$selected" | tr ',' ' ')
          fi

          entries=""
          for rid in $selected; do
            os=$(runner_for "$rid")
            if [ -z "$os" ]; then
              echo "::error::'$rid' is not a runtime identifier this workflow knows"
              for known in $ORDER; do echo "  known: $known"; done
              exit 1
            fi
            entries="${entries}{\"rid\":\"$rid\",\"os\":\"$os\"},"
            echo "  $rid on $os"
          done

          echo "matrix=[${entries%,}]" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # From the CD run rather than packed here, so the thing under test is the artifact that
      # would be published, byte for byte.
      # Two ways in, because the artifact lives in a different place depending on who is asking.
      # Called from the CD it belongs to this same run, and download-artifact finds it with no
      # id at all. Dispatched by hand it belongs to a run that finished days ago, which only
      # `gh run download` can reach.
      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: DesktopSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p DesktopSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY" \
            -n nuget-packages -D DesktopSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la DesktopSmokeTest/local-packages/

          pkg=$(ls DesktopSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on ${{ matrix.rid }}"

      - name: Run the package on ${{ matrix.rid }}
        shell: bash
        working-directory: DesktopSmokeTest
        run: |
          set -euo pipefail
          dotnet run -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"

# Runs the package on every runtime identifier it ships, before it is published.
#
# The CD proves the package builds. This proves it works: each leg installs the .nupkg a CD run
# produced, calls into the native library through it, drives a tileset to its root tile from a
# host written in C#, and fails the job if any of that does not happen.
#
# win-arm64 is cross-compiled in CesiumC, on an x64 Windows runner, so its library is executed
# nowhere else. This is the only thing that runs it.
#
# browser-wasm needs its own job rather than a row in the matrix, because nothing about it
# resembles the others: the archive is linked into the application when it publishes instead of
# being loaded out of runtimes/ at run time, so what makes it work is the package's
# buildTransitive targets file and the name the archive is packed under. WasmSmokeTest existed
# for weeks before this and no workflow ran it, which is how the same two mistakes went unnoticed
# in Evergine.Bindings.JoltPhysics until somebody opened the published .nupkg by hand.
#
# Intel macOS used to be the sixth. It was dropped on 2026-08-08 for the reason this file exists
# to prevent: three attempts across two days never got a macos-13 runner, so it was the one
# identifier shipping without anything having ever executed it.
name: Package smoke test

on:
  # Called by the CD, where it stands between packing and publishing, and dispatchable by hand
  # against any past run's artifact.
  workflow_call:
    inputs:
      cd-run-id:
        description: >-
          The CD run whose nuget-packages artifact to test. Leave empty when calling from the
          run that produced it, which is the normal case.
        required: false
        type: string
        default: ''
      rids:
        description: >-
          Comma-separated desktop runtime identifiers to run. Empty means all five. The wasm leg
          is a separate job and always runs.
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      cd-run-id:
        description: >-
          The CD run whose nuget-packages artifact to test, e.g. 31220702712. Take it from a run
          started with skip-assets-publishing, so nothing has been published yet.
        required: true
        type: string
      rids:
        description: >-
          Comma-separated desktop runtime identifiers to run, e.g. win-arm64. Leave empty for all
          five. Retrying one identifier should not drag the four that already passed along with
          it. This does not reach the wasm leg, which is a separate job and always runs.
        required: false
        type: string

jobs:
  # The matrix is built here rather than filtered in the job below, because an `if` on a matrix
  # job does not stop it queueing for a runner -- it would sit waiting for the very machine that
  # is scarce, and then skip.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          WANTED: ${{ inputs.rids }}
        run: |
          set -euo pipefail

          # Plain shell rather than jq, so the whole thing can be run on a developer machine
          # before it is pushed. win-arm64 is cross-compiled in CesiumC, so this workflow is the
          # only place its binary ever executes.
          ORDER="win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64"
          runner_for() {
            case "$1" in
              win-x64)     echo windows-latest ;;
              win-arm64)   echo windows-11-arm ;;
              linux-x64)   echo ubuntu-latest ;;
              linux-arm64) echo ubuntu-24.04-arm ;;
              osx-arm64)   echo macos-14 ;;
              *)           echo "" ;;
            esac
          }

          selected="${WANTED:-}"
          if [ -z "$selected" ]; then
            selected="$ORDER"
          else
            selected=$(echo "$selected" | tr ',' ' ')
          fi

          entries=""
          for rid in $selected; do
            os=$(runner_for "$rid")
            if [ -z "$os" ]; then
              echo "::error::'$rid' is not a runtime identifier this workflow knows"
              for known in $ORDER; do echo "  known: $known"; done
              exit 1
            fi
            entries="${entries}{\"rid\":\"$rid\",\"os\":\"$os\"},"
            echo "  $rid on $os"
          done

          echo "matrix=[${entries%,}]" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The artifact the CD produced rather than one packed here, so the thing under test is
      # what would be published, byte for byte.
      #
      # Two ways in, because the artifact lives in a different place depending on who is asking.
      # Called from the CD it belongs to this same run, and download-artifact finds it with no
      # id at all. Dispatched by hand it belongs to a run that finished days ago, which only
      # `gh run download` can reach.
      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: DesktopSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p DesktopSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY" \
            -n nuget-packages -D DesktopSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la DesktopSmokeTest/local-packages/

          pkg=$(ls DesktopSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on ${{ matrix.rid }}"

      - name: Run the package on ${{ matrix.rid }}
        shell: bash
        working-directory: DesktopSmokeTest
        run: |
          set -euo pipefail
          dotnet run -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"

  # Its own job rather than a row in the matrix above, because almost nothing is shared: there is
  # no runtime identifier to select, the wasm workload has to be installed, publishing is not
  # optional, and the thing that runs the result is node rather than the host.
  #
  # The fetch and the version parse are repeated from the desktop job instead of being hoisted
  # into `prepare`. Hoisting would mean prepare downloading the artifact too, which trades a dozen
  # duplicated lines for a coupling between a job that decides a matrix and the artifact under
  # test. The duplication is the cheaper of the two.
  wasm:
    name: browser-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Not present on the runner by default, and without it WasmBuildNative has no Emscripten to
      # link with.
      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Fetch the package from this run
        if: inputs.cd-run-id == ''
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: WasmSmokeTest/local-packages

      - name: Fetch the package from an earlier run
        if: inputs.cd-run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p WasmSmokeTest/local-packages
          gh run download "${{ inputs.cd-run-id }}" --repo "$GITHUB_REPOSITORY" \
            -n nuget-packages -D WasmSmokeTest/local-packages

      - name: Work out which version is under test
        shell: bash
        run: |
          set -euo pipefail
          ls -la WasmSmokeTest/local-packages/

          pkg=$(ls WasmSmokeTest/local-packages/*.nupkg | head -1)
          version=$(basename "$pkg" .nupkg | sed 's/^Evergine\.Bindings\.CesiumNative\.//')
          echo "CESIUM_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing $version on browser-wasm"

      # Publish then node, not `dotnet run`: there is no host that runs a browser-wasm application,
      # and the link that this whole leg exists to check only happens on publish.
      - name: Run the package on browser-wasm
        shell: bash
        working-directory: WasmSmokeTest
        run: |
          set -euo pipefail
          dotnet publish -c Release -p:CesiumNativeVersion="$CESIUM_NATIVE_VERSION"
          node bin/Release/net10.0/browser-wasm/AppBundle/main.mjs
